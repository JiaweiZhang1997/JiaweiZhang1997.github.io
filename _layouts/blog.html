<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <script>
      (function() {
        if (localStorage.getItem("blog-theme") === "dark") {
          document.documentElement.classList.add("blog-theme-dark");
        }
      })();
    </script>
  </head>

  <body class="blog-shell">
    <header class="blog-masthead">
      <div class="blog-masthead__inner">
        <a class="blog-brand" href="{{ '/blog/' | relative_url }}" target="_self">Jiawei's Log</a>
        <nav class="blog-nav" aria-label="Blog navigation">
          <a href="{{ '/blog/' | relative_url }}" target="_self">Posts</a>
          <a href="{{ '/blog/archive/' | relative_url }}" target="_self">Archive</a>
          <a href="{{ '/blog/search/' | relative_url }}" target="_self">Search</a>
          <a href="{{ '/blog/tags/' | relative_url }}" target="_self">Tags</a>
          <a href="{{ '/blog/faq/' | relative_url }}" target="_self">FAQ</a>
          <a href="{{ '/' | relative_url }}" target="_self">Home</a>
        </nav>
        {% include blog-theme-toggle.html %}
      </div>
    </header>

    <main class="blog-main" id="main" role="main">
      {{ content }}
    </main>

    <script>
      (function() {
        var root = document.documentElement;
        var button = document.querySelector(".blog-theme-toggle");
        var savedTheme = localStorage.getItem("blog-theme");

        if (savedTheme === "dark") {
          root.classList.add("blog-theme-dark");
        }

        function syncButton() {
          var isDark = root.classList.contains("blog-theme-dark");
          if (button) {
            button.setAttribute("aria-pressed", String(isDark));
          }
        }

        if (button) {
          button.addEventListener("click", function() {
            var isDark = root.classList.toggle("blog-theme-dark");
            localStorage.setItem("blog-theme", isDark ? "dark" : "light");
            syncButton();
          });
        }

        syncButton();
      })();
    </script>
  </body>
</html>
